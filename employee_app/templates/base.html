<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Employee Management System
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f6fa;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .nav-link {
            margin-right: 6px;
        }

        .content {
            padding-top: 30px;
            padding-bottom: 40px;
        }

        .logout-link {
            color: #ff6b6b !important;
        }

        .logout-link:hover {
            color: #ff8787 !important;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid px-4">


        <!-- Brand -->

        <a
            class="navbar-brand"
            href="{% url 'dashboard' %}">

            Employee Management

        </a>


        <!-- Mobile Menu Button -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar Menu -->

        <div
            class="collapse navbar-collapse"
            id="navbarMenu">


            <!-- Left Menu -->

            <ul class="navbar-nav me-auto">


                <!-- Dashboard -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'dashboard' %}">

                        Dashboard

                    </a>

                </li>


                <!-- Employees -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'show_employees' %}">

                        Employees

                    </a>

                </li>


                <!-- Add Employee -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'add_employee' %}">

                        Add Employee

                    </a>

                </li>

            </ul>


            <!-- Right Menu -->

            <ul class="navbar-nav">


                <!-- Profile -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{% url 'profile' %}">

                        👤 {{ request.user.username }}

                    </a>

                </li>


                <!-- Change Password -->

                <li class="nav-item">

                    <a
                        class="nav-link text-warning"
                        href="{% url 'change_password' %}">

                        🔐 Change Password

                    </a>

                </li>


                <!-- Logout -->

                <li class="nav-item">

                    <a
                        class="nav-link logout-link"
                        href="{% url 'user_logout' %}">

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<div class="container content">


    <!-- Messages -->

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
                role="alert">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
                </button>

            </div>

        {% endfor %}

    {% endif %}


    <!-- Page Content -->

    {% block content %}

    {% endblock %}


</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
