{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}

<style>
    /* Login page theme */
    .password-page {
        min-height: 85vh;
        margin: -1px;
        padding: 30px 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f7fa, #e4e9f2);
        font-family: Arial, sans-serif;
        border-radius: 12px;
    }

    .password-card {
        width: 100%;
        max-width: 500px;
        background: #ffffff;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        overflow: hidden;
    }

    .password-header {
        background: #212529;
        color: #ffffff;
        padding: 30px 25px;
        text-align: center;
    }

    .password-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #ffffff;
        color: #212529;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
    }

    .password-header h3 {
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .password-header p {
        margin: 0;
        color: #adb5bd;
        font-size: 14px;
    }

    .password-body {
        padding: 30px;
        background: #ffffff;
    }

    .password-body .form-label {
        font-weight: 600;
        color: #343a40;
    }

    .password-body .form-control {
        padding: 11px 13px;
        border-radius: 8px;
        border: 1px solid #ced4da;
    }

    .password-body .form-control:focus {
        border-color: #495057;
        box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.12);
    }

    .password-hint {
        display: block;
        margin-top: 5px;
        color: #6c757d;
        font-size: 13px;
    }

    .password-actions {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 25px;
    }

    .password-actions .btn {
        padding: 11px 16px;
        border-radius: 8px;
        font-weight: 600;
    }

    .password-actions .btn-dark {
        flex: 1;
    }

    @media (max-width: 400px) {
        .password-body {
            padding: 22px;
        }

        .password-actions {
            flex-direction: column;
        }
    }
</style>

<div class="password-page">

    <div class="password-card">

        <!-- Header -->
        <div class="password-header">

            <div class="password-icon">
                🔐
            </div>

            <h3>Change Password</h3>

            <p>Keep your account secure</p>

        </div>

        <!-- Form -->
        <div class="password-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label for="current_password" class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        class="form-control"
                        placeholder="Enter your current password"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="mb-3">

                    <label for="new_password" class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        class="form-control"
                        placeholder="Enter your new password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <small class="password-hint">
                        Password must contain at least 8 characters.
                    </small>

                </div>

                <div class="mb-4">

                    <label for="confirm_password" class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your new password"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                </div>

                <!-- Buttons -->
                <div class="password-actions">

                    <a
                        href="{% url 'profile' %}"
                        class="btn btn-outline-secondary">

                        ← Back

                    </a>

                    <button
                        type="submit"
                        class="btn btn-dark">

                        🔒 Update Password

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
