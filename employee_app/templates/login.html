{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                135deg,
                #f5f7fa,
                #e4e9f2
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

            overflow: hidden;
        }

        .login-header {
            background: #212529;
            color: white;
            padding: 30px 25px;
            text-align: center;
        }

        .login-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #ffffff;
            color: #212529;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-header p {
            margin: 0;
            color: #adb5bd;
            font-size: 14px;
        }

        .login-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            padding: 11px 13px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #495057;
            box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #6c757d;

            cursor: pointer;

            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 11px;

            border-radius: 8px;

            font-weight: 600;
            font-size: 16px;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;

            font-size: 13px;
            color: #6c757d;
        }

        .alert {
            border-radius: 8px;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Header -->

        <div class="login-header">

            <div class="login-icon">
                👤
            </div>

            <h2>
                Employee Management
            </h2>

            <p>
                Sign in to access your dashboard
            </p>

        </div>


        <!-- Login Form -->

        <div class="login-body">

            <!-- Messages -->

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger alert-dismissible fade show"
                         role="alert">

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>

                </div>


                <!-- Password -->

                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label">

                        Password

                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Show or hide password">

                            👁️

                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-dark login-btn">

                    Login

                </button>

            </form>


            <div class="login-footer">

                Employee Management System

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Show / Hide Password -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".toggle-password");


    if (password.type === "password") {

        password.type = "text";

        button.textContent = "🙈";

    } else {

        password.type = "password";

        button.textContent = "👁️";

    }

}

</script>

</body>

</html>
